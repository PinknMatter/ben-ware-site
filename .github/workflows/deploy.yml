# The site is deployed to benware.net by Cloudflare, which builds this repo
# itself — there is no build step here any more.
#
# All this publishes to GitHub Pages is a redirect to benware.net. The old
# address (pinknmatter.github.io/ben-ware-site) is in the client's email
# thread; left alone, GitHub Pages would keep serving the last build it made
# forever, so the alternative to this is a stale second copy of the site.
#
# To switch the old address off completely instead: delete this workflow and
# set Settings → Pages → Source to None.
name: Redirect the old GitHub Pages address to benware.net

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./redirect

      - id: deployment
        uses: actions/deploy-pages@v4

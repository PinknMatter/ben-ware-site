<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ben Ware — now at benware.net</title>

    <!-- The site moved from GitHub Pages to benware.net. This page is all that
         is left here, because the old address is in the client's email thread
         and deleting the deployment outright would either rot into a stale copy
         of the site or 404 a link he has already shared.

         noindex + canonical so the old address stops competing in search;
         the redirect below does the actual work. -->
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://benware.net/" />
    <meta http-equiv="refresh" content="0; url=https://benware.net/" />

    <script>
      // Keep the path: /ben-ware-site/books lands on benware.net/books rather
      // than dumping everyone on the homepage. The meta refresh above is the
      // fallback when this does not run.
      (function () {
        var path = location.pathname.replace(/^\/ben-ware-site/, '') || '/';
        location.replace('https://benware.net' + path + location.search + location.hash);
      })();
    </script>

    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: #fff;
        color: #2b2723;
        font: 1.0625rem/1.6 Georgia, 'Times New Roman', serif;
        text-align: center;
      }
      a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <p>
      This site now lives at <a href="https://benware.net/">benware.net</a>.
    </p>
  </body>
</html>
